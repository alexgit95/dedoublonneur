# Profil local : SQLite, pas de dependance Docker externe obligatoire.
spring:
  datasource:
    # Pas de sous-dossier : le pilote SQLite cree le fichier mais jamais les repertoires parents.
    url: jdbc:sqlite:${APP_SQLITE_PATH:./dedoublonneur-local.db}?busy_timeout=30000&synchronous=NORMAL
    driver-class-name: org.sqlite.JDBC
    hikari:
      connection-timeout: 15000
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update

app:
  nas:
    source-path: ${APP_NAS_SOURCE_PATH:C:\Users\bourgois_a\Pictures}
    output-path: ${APP_NAS_OUTPUT_PATH:C:\Users\bourgois_a\Pictures}

logging:
  level:
    fr.dedoublonneur: DEBUG
